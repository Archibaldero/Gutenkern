name: Windows

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Test
        run: dotnet test windows/Gutenkern.Tests/Gutenkern.Tests.csproj -c Release

      - name: Publish
        run: >
          dotnet publish windows/Gutenkern/Gutenkern.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o dist/windows

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows/setup/Gutenkern.iss

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: Gutenkern-windows
          path: |
            dist/installer/Gutenkern-Setup.exe
            dist/windows/Gutenkern.exe
            dist/windows/l10n.json

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/installer/Gutenkern-Setup.exe
            dist/windows/Gutenkern.exe
            dist/windows/l10n.json
