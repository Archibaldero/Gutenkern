name: macOS

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        run: scripts/build-macos.sh

      - name: Zip app
        run: ditto -c -k --keepParent dist/Gutenkern.app dist/Gutenkern-macOS.zip

      - name: Upload macOS build
        uses: actions/upload-artifact@v4
        with:
          name: Gutenkern-macos
          path: dist/Gutenkern-macOS.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Gutenkern-macOS.zip
